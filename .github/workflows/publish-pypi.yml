name: Publish REvFLY to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag (for example, v2.0.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the published distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Expected a release tag such as v2.0.0."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          wheel="revfly-${version}-py3-none-any.whl"
          source="revfly-${version}.tar.gz"
          runtime="revfly-${version}-local-beta.zip"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "$wheel" --pattern "$source" --pattern "$runtime" --pattern SHA256SUMS

          (cd release && sha256sum -c SHA256SUMS)
          mkdir dist
          cp "release/$wheel" "release/$source" dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
